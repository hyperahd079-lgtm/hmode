<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عالمنا الخاص ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        
        body { 
            background-color: #080204; 
            color: #fff; 
            height: 100vh; 
            height: 100dvh;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative; 
            transition: background 0.6s ease;
        }

        .screen-overlay { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; 
            background: rgba(0, 0, 0, 0.75); 
            transition: opacity 0.5s ease; 
            opacity: 1; 
            pointer-events: none; 
        }
        body.main-lamp-on .screen-overlay { opacity: 0; }

        .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: 0; transition: opacity 1s ease; }
        body.main-lamp-on .hearts-bg, body.login-lamp-on .hearts-bg { opacity: 1; }
        .bg-heart { position: absolute; bottom: -50px; color: rgba(255, 105, 180, 0.25); font-size: 18px; animation: floatUp 8s linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; } }
        
        .login-container { position: relative; z-index: 30; width: 100%; max-width: 750px; background: rgba(20, 8, 12, 0.9); backdrop-filter: blur(15px); border-radius: 24px; display: flex; justify-content: space-around; align-items: center; padding: 25px; border: 1px solid rgba(255, 182, 193, 0.15); gap: 15px; }
        
        .lamp-box { position: relative; width: 200px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        .lamp-shade { width: 140px; height: 80px; background: linear-gradient(135deg, #4a1220, #170309); border-radius: 70px 70px 10px 10px; position: relative; z-index: 3; transition: all 0.5s ease; }
        .lamp-bulb { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 34px; height: 16px; background: #2a0e16; border-radius: 50%; z-index: 2; transition: all 0.5s ease; }
        .lamp-stand { width: 8px; height: 110px; background: linear-gradient(90deg, #2b1119, #4a1f2c); z-index: 1; }
        .lamp-base { width: 100px; height: 14px; background: #3d1723; border-radius: 10px 10px 4px 4px; z-index: 2; }
        
        .pull-string { position: absolute; top: 140px; right: 40px; width: 15px; height: 90px; cursor: pointer; z-index: 100; display: flex; justify-content: center; }
        .pull-line { width: 3px; height: 75px; background: #f39c12; transition: transform 0.1s ease; }
        .pull-string:active .pull-line { transform: translateY(12px); }
        .pull-handle { position: absolute; bottom: 0; width: 14px; height: 14px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 6px #ffd700; }
        
        .light-beam { position: absolute; top: 140px; width: 240px; height: 200px; background: radial-gradient(circle at top, rgba(255, 182, 193, 0.4), transparent 75%); border-radius: 50%; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; z-index: 2; }
        
        body.login-lamp-on .lamp-shade { background: linear-gradient(135deg, #ffb6c1, #ff69b4, #e74c3c); box-shadow: 0 0 35px rgba(255, 105, 180, 0.7); }
        body.login-lamp-on .lamp-bulb { background: #fff; box-shadow: 0 0 20px #fff; }
        body.login-lamp-on .light-beam { opacity: 1; }
        
        .login-card { width: 100%; max-width: 320px; padding: 25px 20px; background: rgba(255, 255, 255, 0.02); border-radius: 18px; opacity: 0.15; transition: all 0.5s ease; pointer-events: none; }
        body.login-lamp-on .login-card { opacity: 1; background: rgba(255, 192, 203, 0.05); border: 1px solid rgba(255, 182, 193, 0.2); pointer-events: all; }
        .login-card h2 { margin-bottom: 15px; text-align: center; color: #ffb6c1; font-size: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; color: #dda0dd; margin-bottom: 4px; font-size: 13px; }
        .input-group input { width: 100%; padding: 10px 12px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 192, 203, 0.15); border-radius: 10px; color: #fff; outline: none; font-size: 14px; }
        .login-btn { width: 100%; padding: 12px; background: #333; color: #777; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        body.login-lamp-on .login-btn { background: linear-gradient(135deg, #ff69b4, #e74c3c); color: #fff; }
        
        .main-page { 
            display: none; 
            z-index: 10; 
            width: 100%; 
            max-width: 850px; 
            height: 100vh; 
            height: 100dvh; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 4px 8px 15px 8px; 
            position: relative; 
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .ceiling-lamps-container { display: flex; justify-content: center; width: 100%; height: 35px; z-index: 100; position: relative; margin-bottom: 0; flex-shrink: 0; }
        .ceiling-lamp { position: relative; display: flex; flex-direction: column; align-items: center; }
        .wire { width: 2px; height: 8px; background: #444; }
        .main-lamp-shade { width: 70px; height: 22px; background: linear-gradient(135deg, #4a1220, #170309); border-radius: 35px 35px 6px 6px; position: relative; transition: all 0.5s ease; }
        
        .main-pull-string { 
            position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 20px; height: 22px; 
            cursor: pointer; z-index: 250; display: flex; justify-content: center; 
        }
        .main-pull-line { width: 2px; height: 16px; background: rgba(255, 215, 0, 0.9); transition: transform 0.1s ease; }
        .main-pull-string:active .main-pull-line { transform: translateY(5px); }
        .main-pull-handle { position: absolute; bottom: 0; width: 8px; height: 8px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 6px #ffd700; }

        .page-content { 
            opacity: 1 !important; 
            visibility: visible !important; 
            transform: translateY(0) !important; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            flex: 1; 
            height: calc(100% - 35px);
            justify-content: flex-start; 
            align-items: center; 
            overflow: hidden; 
        }

        .top-row-grid { display: grid; grid-template-columns: 1.1fr 0.8fr 1.1fr; gap: 6px; width: 100%; margin-top: 2px; position: relative; z-index: 10; flex-shrink: 0; }
        
        .counter-card { background: rgba(255, 182, 193, 0.05); border: 1px solid rgba(255, 182, 193, 0.15); padding: 6px 4px; border-radius: 12px; backdrop-filter: blur(10px); text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .counter-card-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 2px; margin-bottom: 2px; }
        .counter-card h2 { font-size: 11px; color: #ffb6c1; }
        
        .header-actions { display: flex; gap: 3px; align-items: center; }
        .mini-logout-btn { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; padding: 1px 5px; border-radius: 6px; font-size: 8px; cursor: pointer; transition: 0.2s; }
        
        .admin-header-btn { 
            background: linear-gradient(135deg, #f39c12, #d35400); 
            color: #fff; 
            border: none; 
            padding: 1px 5px; 
            border-radius: 6px; 
            font-size: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; 
            box-shadow: 0 0 5px rgba(243, 156, 18, 0.4);
        }

        .game-header-btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: #fff;
            border: none;
            padding: 1px 5px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(155, 89, 182, 0.4);
        }

        .live-clock-box { font-size: 9px; color: #dda0dd; margin-bottom: 2px; direction: ltr; }
        .days-box { font-size: 14px; font-weight: bold; color: #ff69b4; margin: 1px 0; }
        .day-btn { padding: 3px 8px; background: linear-gradient(135deg, #ff69b4, #e74c3c); color: #fff; border: none; border-radius: 20px; font-size: 8px; font-weight: bold; cursor: pointer; }

        .touch-card { background: rgba(255, 182, 193, 0.05); border: 1px solid rgba(255, 182, 193, 0.15); padding: 6px 4px; border-radius: 12px; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
        .fingerprint-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 105, 180, 0.1); border: 2px dashed #ff69b4; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: 0.3s; position: relative; }
        .fingerprint-btn.active { background: rgba(255, 105, 180, 0.4); border-style: solid; box-shadow: 0 0 10px #ff69b4; transform: scale(0.95); }
        .fingerprint-btn.synced { background: #2ecc71; border-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; animation: pulseSync 0.6s infinite alternate; }
        @keyframes pulseSync { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
        .touch-status { font-size: 8px; color: #dda0dd; }

        .miss-card { background: rgba(255, 182, 193, 0.05); border: 1px solid rgba(255, 182, 193, 0.15); padding: 5px 4px; border-radius: 12px; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
        .miss-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 4px 5px; background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; border: none; border-radius: 20px; font-size: 9px; font-weight: bold; cursor: pointer; box-shadow: 0 0 6px rgba(255, 65, 108, 0.4); }
        
        .last-pulse-box {
            font-size: 7.5px;
            color: #ffb6c1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 182, 193, 0.15);
            border-radius: 6px;
            padding: 2px 4px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.1;
        }

        .history-btn { padding: 2px 5px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 182, 193, 0.2); border-radius: 8px; color: #ffb6c1; font-size: 8px; cursor: pointer; width: 100%; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 300; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #180910; border: 1px solid rgba(255, 182, 193, 0.2); border-radius: 18px; width: 90%; max-width: 400px; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 80vh; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 182, 193, 0.1); padding-bottom: 8px; }
        .modal-header h3 { font-size: 15px; color: #ffb6c1; }
        .close-modal-btn { background: none; border: none; color: #ff69b4; font-size: 18px; cursor: pointer; }
        .history-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 50vh; padding-left: 5px; }
        .history-item { background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 10px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-right: 3px solid #ff416c; }
        .history-user { font-weight: bold; color: #ffb6c1; }
        .history-time { font-size: 10px; color: #dda0dd; direction: ltr; }

        .memory-game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .memory-card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 10px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
        }
        .memory-card.flipped, .memory-card.matched {
            background: rgba(255, 105, 180, 0.25);
            transform: scale(0.95);
        }

        .chat-container { 
            width: 100%; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: rgba(25, 10, 15, 0.95); 
            border: 1px solid rgba(255, 182, 193, 0.3); 
            border-radius: 14px; 
            backdrop-filter: blur(10px); 
            overflow: hidden; 
            margin-bottom: 10px; 
            min-height: 0;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.15);
        }
        .chat-header { padding: 6px 10px; background: rgba(255, 105, 180, 0.12); color: #ffb6c1; font-weight: bold; font-size: 11px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .partner-info { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #ffb6c1; }
        .battery-badge { font-size: 9px; padding: 1px 6px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; color: #ffb6c1; border: 1px solid rgba(255, 182, 193, 0.2); }
        .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
        .status-dot.online { background-color: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
        .status-dot.offline { background-color: #e74c3c; }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .chat-input-area input { 
            width: 100%; 
            height: 38px; 
            padding: 0 12px; 
            background: rgba(255, 255, 255, 0.12); 
            border: 1px solid rgba(255, 182, 193, 0.4); 
            border-radius: 19px; 
            color: #fff; 
            outline: none; 
            font-size: 12px; 
            transition: all 0.3s ease;
        }
        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .input-status-overlay {
            position: absolute;
            right: 14px;
            top: -18px;
            font-size: 10px;
            pointer-events: none;
            display: none;
            font-style: italic;
            background: rgba(20, 8, 12, 0.9);
            padding: 1px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 182, 193, 0.2);
            z-index: 10;
        }
        .input-status-overlay.typing {
            display: block;
            color: #2ecc71;
            animation: pulseTyping 1.2s infinite;
        }
        .input-status-overlay.recording {
            display: block;
            color: #e74c3c;
            animation: pulseTyping 0.8s infinite;
        }
        @keyframes pulseTyping { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        .pinned-bar { display: none; background: rgba(255, 105, 180, 0.15); border-bottom: 1px solid rgba(255, 182, 193, 0.2); padding: 4px 8px; font-size: 10px; color: #ffb6c1; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .pinned-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%; }
        .unpin-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 10px; }

        .chat-messages { flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
        .message-wrapper { display: flex; align-items: center; gap: 2px; width: 100%; }
        .message-wrapper.mine { justify-content: flex-start; }
        .message-wrapper.other { justify-content: flex-end; }
        
        .message-bubble { max-width: 78%; padding: 6px 10px; border-radius: 12px; font-size: 12px; word-wrap: break-word; user-select: text; display: flex; flex-direction: column; line-height: 1.4; }
        .message-bubble.mine { background: linear-gradient(135deg, #ff69b4, #d63031); color: #fff; border-bottom-right-radius: 2px; }
        .message-bubble.other { background: rgba(255, 255, 255, 0.18); color: #fff; border-bottom-left-radius: 2px; }
        .msg-author { font-size: 9px; opacity: 0.9; margin-bottom: 2px; font-weight: bold; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 3px; }
        .msg-time { font-size: 8px; opacity: 0.8; direction: ltr; }
        
        .read-status { font-size: 10px; font-weight: bold; }
        .read-status.sent { color: rgba(255,255,255,0.7); }
        .read-status.delivered { color: rgba(255,255,255,0.9); }
        .read-status.read { color: #3498db; text-shadow: 0 0 3px rgba(52, 152, 219, 0.6); }

        .admin-action-btn { background: none; border: none; font-size: 9px; cursor: pointer; opacity: 0.6; padding: 1px 2px; }
        
        .chat-input-area { 
            width: 100%; 
            padding: 6px 8px; 
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255, 182, 193, 0.3); 
            display: flex; 
            align-items: center;
            gap: 5px; 
            background: #1b0c13; 
            box-sizing: border-box; 
            z-index: 100;
            flex-shrink: 0;
        }
        .send-btn, .heart-quick-btn, .voice-record-btn { 
            height: 38px; 
            padding: 0 10px; 
            background: linear-gradient(135deg, #ff69b4, #e74c3c); 
            color: #fff; 
            border: none; 
            border-radius: 19px; 
            font-weight: bold; 
            font-size: 11px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none;
            flex-shrink: 0;
        }
        .heart-quick-btn { font-size: 14px; padding: 0 8px; }
        .voice-record-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 182, 193, 0.4); }
        .voice-record-btn.recording { background: #e74c3c; animation: pulseRecord 1s infinite; }
        @keyframes pulseRecord { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

        .audio-player-box { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.3); padding: 4px 8px; border-radius: 12px; margin-top: 3px; }
        .audio-play-btn { background: none; border: none; color: #ffb6c1; font-size: 14px; cursor: pointer; }

        .admin-opt-btn { width: 100%; padding: 10px 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 182, 193, 0.2); color: #ffb6c1; border-radius: 10px; font-size: 12px; cursor: pointer; text-align: right; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .admin-opt-btn:hover { background: rgba(255, 105, 180, 0.2); }

        body.main-lamp-on #mainLampShade { background: linear-gradient(135deg, #ffb6c1, #ff69b4, #e74c3c); box-shadow: 0 0 30px #ff69b4; }
    </style>
</head>
<body>

    <div class="screen-overlay"></div>
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-container" id="loginContainer">
        <div class="lamp-box">
            <div class="lamp-shade"><div class="lamp-bulb"></div></div>
            <div class="light-beam"></div>
            <div class="lamp-stand"></div>
            <div class="lamp-base"></div>
            <div class="pull-string" id="loginPullString">
                <div class="pull-line"></div>
                <div class="pull-handle"></div>
            </div>
        </div>

        <div class="login-card">
            <h2>عالمنا الخاص ❤️</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>الاسم</label>
                    <input type="text" id="username" placeholder="اسمك اللطيف..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>كلمة السر</label>
                    <input type="password" id="password" placeholder="••••">
                </div>
                <button type="submit" class="login-btn">دخول</button>
            </form>
        </div>
    </div>

    <!-- الصفحة الرئيسية -->
    <div class="main-page" id="mainPage">
        <div class="ceiling-lamps-container">
            <div class="ceiling-lamp">
                <div class="wire"></div>
                <div class="main-lamp-shade" id="mainLampShade">
                    <div class="main-pull-string" id="mainPullString">
                        <div class="main-pull-line"></div>
                        <div class="main-pull-handle"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-content">
            <div class="top-row-grid">
                <div class="counter-card">
                    <div class="counter-card-header">
                        <h2 id="typingTitle">أهلاً بك ❤️</h2>
                        <div class="header-actions">
                            <button class="game-header-btn" onclick="openMemoryGame()">🎮 لعبة</button>
                            <button class="admin-header-btn" id="adminHeaderBtn">صلاحيات ⚙️</button>
                            <button class="mini-logout-btn" onclick="handleLogout()">خروج</button>
                        </div>
                    </div>
                    <div class="live-clock-box" id="liveClock">التاريخ...</div>
                    <div class="days-box" id="daysCounter">0 أيام</div>
                    <button class="day-btn" id="markDayBtn">حضور 🌹</button>
                </div>

                <div class="touch-card">
                    <h2 style="font-size: 10px; color: #ffb6c1;">البصمة المشتركة</h2>
                    <div class="fingerprint-btn" id="fingerprintBtn">🖐️</div>
                    <span class="touch-status" id="touchStatus">اضغط باستمرار...</span>
                </div>

                <div class="miss-card">
                    <h2 style="font-size: 10px; color: #ffb6c1;">نبضات الشوق</h2>

        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        const iconsList = ['💖', '🌹', '✨', '💍', '💖', '🌹', '✨', '💍'];

            document.getElementById('memoryModal').style.display = 'flex';

            document.getElementById('memoryModal').style.display = 'none';

        function initMemoryBoard() {
            const grid = document.getElementById('memoryGrid');
            grid.innerHTML = '';
            const shuffled = [...iconsList].sort(() => 0.5 - Math.random());
            let flippedCards = [];
            let matchedCount = 0;

            shuffled.forEach((icon, idx) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.icon = icon;
                card.innerHTML = '❓';
                card.onclick = () => {
                    if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;
                    card.classList.add('flipped');
                    card.innerHTML = icon;
                    flippedCards.push(card);

                    if (flippedCards.length === 2) {
                        const [card1, card2] = flippedCards;
                        if (card1.dataset.icon === card2.dataset.icon) {
                            card1.classList.add('matched');
                            card2.classList.add('matched');
                            flippedCards = [];
                            matchedCount += 2;
                            if (matchedCount === shuffled.length) {
                                launchHeartsExplosion();
                                setTimeout(() => alert('🎉 مبروك! لقد فزتما بلعبة مطابقة القلوب بنجاح ❤️'), 300);
                            }
                        } else {
                            setTimeout(() => {
                                card1.classList.remove('flipped');
                                card1.innerHTML = '❓';
                                card2.classList.remove('flipped');
                                card2.innerHTML = '❓';
                                flippedCards = [];
                            }, 700);
                        }
                    }
                };
                grid.appendChild(card);
            });
        }

        function setupSharedFingerprint() {
            const btn = document.getElementById('fingerprintBtn');
            const statusText = document.getElementById('touchStatus');
            const touchRef = db.ref('shared_touch');

            function startTouch(e) {
                if (e.cancelable) e.preventDefault();
                btn.classList.add('active');
                touchRef.child(myKey).set(true);
            }

            function endTouch(e) {
                btn.classList.remove('active');
                touchRef.child(myKey).set(false);
            }

            btn.addEventListener('mousedown', startTouch);
            btn.addEventListener('mouseup', endTouch);
            btn.addEventListener('mouseleave', endTouch);

            btn.addEventListener('touchstart', startTouch, { passive: false });
            btn.addEventListener('touchend', endTouch);
            btn.addEventListener('touchcancel', endTouch);

            touchRef.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const myTouch = data[myKey];
                const partnerTouch = data[partnerKey];

                if (myTouch && partnerTouch) {
                    btn.classList.add('synced');
                    statusText.innerHTML = "<b style='color:#2ecc71;'>✨ تلامس الأيدي! ✨</b>";
                    triggerVibration();
                    launchHeartsExplosion();
                } else if (myTouch) {
                    btn.classList.remove('synced');
                    statusText.innerText = `بانتظار ${partnerUser}...`;
                } else if (partnerTouch) {
                    btn.classList.remove('synced');
                    statusText.innerHTML = `<span style='color:#ff69b4;'>${partnerUser} يضع أصبعه!</span>`;
                } else {
                    btn.classList.remove('synced');
                    statusText.innerText = "اضغط باستمرار...";
                }
            });
        }

        function setupBatterySync() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then((battery) => {
                    function updateAndSendBattery() {
                        const level = Math.round(battery.level * 100);
                        const isCharging = battery.charging;
                        db.ref(`battery/${myKey}`).set({
                            level: level,
                            charging: isCharging,
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    }

                    updateAndSendBattery();
                    battery.addEventListener('levelchange', updateAndSendBattery);
                    battery.addEventListener('chargingchange', updateAndSendBattery);
                });
            }

            db.ref(`battery/${partnerKey}`).on('value', (snapshot) => {
                const data = snapshot.val();
                const batteryElem = document.getElementById('partnerBattery');
                if (data && data.level !== undefined) {
                    batteryElem.style.display = 'inline-block';
                    const icon = data.charging ? '⚡' : '🔋';
                    batteryElem.innerText = `${icon} ${data.level}%`;
                }
            });
        }

        function setupPresenceAndTypingSystem() {
            const myStatusRef = db.ref(`status/${myKey}`);
            const myTypingRef = db.ref(`typing/${myKey}`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === false) return;
                myStatusRef.onDisconnect().set({
                    online: false,
                    last_seen: firebase.database.ServerValue.TIMESTAMP
                });
                myTypingRef.onDisconnect().set('idle');

                myStatusRef.set({
                    online: true,
                    last_seen: firebase.database.ServerValue.TIMESTAMP
                });
            });

            document.getElementById('partnerName').innerText = partnerUser;

            db.ref(`typing/${partnerKey}`).on('value', (snapshot) => {
                const typingState = snapshot.val();
                const overlay = document.getElementById('inputStatusOverlay');
                
                if (typingState === 'text') {
                    overlay.className = "input-status-overlay typing";
                    overlay.innerText = "يكتب الآن... ✍️";
                } else if (typingState === 'voice') {
                    overlay.className = "input-status-overlay recording";
                    overlay.innerText = "يسجل مقطعاً صوتياً... 🎙️";
                } else {
                    overlay.className = "input-status-overlay";
                    overlay.innerText = "";
                }
            });

            db.ref(`status/${partnerKey}`).on('value', (snap) => {
                const data = snap.val();
                const dot = document.getElementById('partnerStatusDot');
                const statusText = document.getElementById('partnerStatusText');

                if (data && data.online) {
                    dot.className = "status-dot online";
                    statusText.innerText = "متصل الآن";
                    statusText.style.color = "#2ecc71";
                } else {
                    dot.className = "status-dot offline";
                    if (data && data.last_seen) {
                        const date = new Date(data.last_seen);
                        const timeStr = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                        const dateStr = date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' });
                        statusText.innerText = `آخر ظهور: ${dateStr} - ${timeStr}`;
                    } else {
                        statusText.innerText = "غير متصل";
                    }
                    statusText.style.color = "#dda0dd";
                }
            });

            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('input', () => {
                if (!isRecording) {
                    myTypingRef.set('text');
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => { myTypingRef.set('idle'); }, 2000);
                }
            });
        }

        function formatFullDateTime(timestamp) {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            return `${date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' })} - ${date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
        }

        function setupLiveClockAndCounter() {
            const markBtn = document.getElementById('markDayBtn');
            const daysCounter = document.getElementById('daysCounter');
            const clockBox = document.getElementById('liveClock');

            function updateClockAndCheckDate() {
                const now = new Date();
                clockBox.innerText = now.toLocaleDateString('ar-EG', { weekday: 'short', day: 'numeric' }) + " | " + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const todayString = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0');

                db.ref('last_click_date').once('value', (snapshot) => {
                    if (snapshot.val() === todayString) {
                        markBtn.disabled = true;
                        markBtn.innerText = "تم ✨";
                    } else {
                        markBtn.disabled = false;
                        markBtn.innerText = "حضور 🌹";
                    }
                });
            }

            setInterval(updateClockAndCheckDate, 1000);
            updateClockAndCheckDate();

            db.ref('love_days').on('value', (snapshot) => {
                daysCounter.innerText = `${snapshot.val() || 0} أيام`;
            });

            markBtn.onclick = () => {
                const now = new Date();
                const todayString = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0');

                db.ref('last_click_date').once('value', (snapshot) => {
                    if (snapshot.val() !== todayString) {
                        db.ref('love_days').transaction(c => (c || 0) + 1);
                        db.ref('last_click_date').set(todayString);
                        launchHeartsExplosion();
                        updateClockAndCheckDate();
                    }
                });
            };
        }

        function setupMissYouSystem() {
            const missBtn = document.getElementById('missBtn');
            const lastPulseSender = document.getElementById('lastPulseSender');
            const lastPulseTime = document.getElementById('lastPulseTime');

            missBtn.onclick = () => {
                const newPulse = {
                    sender: currentUser,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };

                db.ref('miss_heart_signal').set(newPulse);
                db.ref('miss_heart_history').push(newPulse);
                
                triggerVibration();
                launchHeartsExplosion();
            };

            db.ref('miss_heart_signal').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                lastPulseSender.innerText = data.sender || "--";
                lastPulseTime.innerText = formatFullDateTime(data.timestamp);

                if (data.sender && data.sender.toLowerCase() !== currentUser.toLowerCase()) {
                    if (!isInitialLoad) {
                        triggerVibration();
                        playClickSound();
                        launchHeartsExplosion();
                    }
                }
                isInitialLoad = false;
            });
        }

        function setupHistoryModal() {
            const historyModal = document.getElementById('historyModal');
            const openHistoryBtn = document.getElementById('openHistoryBtn');
            const closeHistoryBtn = document.getElementById('closeHistoryBtn');
            const historyList = document.getElementById('historyList');

            openHistoryBtn.onclick = () => {
                historyModal.style.display = 'flex';
                historyList.innerHTML = '<div style="text-align: center; color: #888; font-size: 12px;">جاري تحميل السجل...</div>';

                db.ref('miss_heart_history').limitToLast(30).once('value', (snapshot) => {
                    historyList.innerHTML = '';
                    const data = snapshot.val();
                    if (!data) {
                        historyList.innerHTML = '<div style="text-align: center; color: #dda0dd; font-size: 12px;">لا يوجد سجل نبضات سابق 🌹</div>';

                    }

                    });
                });
            };

            closeHistoryBtn.onclick = () => { historyModal.style.display = 'none'; };
            historyModal.onclick = (e) => { if (e.target === historyModal) historyModal.style.display = 'none'; };

        function renderStatusTicks(status) {
            if (status === 'read') return `<span class="read-status read">✓✓</span>`;
            if (status === 'delivered') return `<span class="read-status delivered">✓✓</span>`;
            return `<span class="read-status sent">✓</span>`;
        }

        function setupLiveChat() {
            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML = '';
            db.ref('messages').off();

            db.ref('messages').once('value', (snapshot) => {
                snapshot.forEach(child => {
                    const msg = child.val();
                    if (msg.author.toLowerCase() !== currentUser.toLowerCase() && msg.status !== 'read') {
                        db.ref(`messages/${child.key}/status`).set('read');
                    }
                });
            });

            db.ref('messages').on('child_added', (snapshot) => {
                const msgKey = snapshot.key;
                const msg = snapshot.val();
                
                const wrapper = document.createElement('div');
                const isMine = msg.author.toLowerCase() === currentUser.toLowerCase();
                wrapper.className = `message-wrapper ${isMine ? 'mine' : 'other'}`;
                wrapper.id = `msg-${msgKey}`;

                if (!isMine && msg.status !== 'read') {
                    db.ref(`messages/${msgKey}/status`).set('read');
                }

                let adminBtns = '';
                if (isAdmin) {
                    adminBtns = `
                        <button class="admin-action-btn" onclick="deleteMessage('${msgKey}')" title="حذف">🗑️</button>
                        <button class="admin-action-btn" onclick="pinMessage('${(msg.text || 'ملاحظة صوتية').replace(/'/g, "\\'")}')" title="تثبيت">📌</button>
                    `;
                }

                const ticksHtml = isMine ? renderStatusTicks(msg.status || 'sent') : '';
                
                let contentHtml = `<span>${msg.text}</span>`;
                if (msg.type === 'voice') {
                    contentHtml = `
                        <div style="font-size:10px; font-weight:bold; margin-bottom:2px;">🎙️ ملاحظة صوتية دافئة</div>
                        <div class="audio-player-box">
                            <button class="audio-play-btn" onclick="playVoiceNote('${msg.audioData}')">▶️ استماع</button>
                            <span style="font-size:9px; color:#dda0dd;">مقطع صوتي</span>
                        </div>
                    `;
                }

                wrapper.innerHTML = `
                    ${isMine && isAdmin ? adminBtns : ''}
                    <div class="message-bubble ${isMine ? 'mine' : 'other'}">
                        <span class="msg-author">${msg.author}</span>
                        ${contentHtml}
                        <div class="msg-footer">
                            <span class="msg-time">${formatFullDateTime(msg.timestamp)}</span>
                            <span id="ticks-${msgKey}">${ticksHtml}</span>
                        </div>
                    </div>
                    ${!isMine && isAdmin ? adminBtns : ''}
                `;
                chatBox.appendChild(wrapper);
                
                setTimeout(() => {
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 50);
            });

            db.ref('messages').on('child_changed', (snapshot) => {
                const msgKey = snapshot.key;
                const msg = snapshot.val();
                const ticksSpan = document.getElementById(`ticks-${msgKey}`);
                if (ticksSpan && msg.author.toLowerCase() === currentUser.toLowerCase()) {
                    ticksSpan.innerHTML = renderStatusTicks(msg.status);
                }
            });

            db.ref('messages').on('child_removed', (snapshot) => {
                const removedMsg = document.getElementById(`msg-${snapshot.key}`);
                if (removedMsg) removedMsg.remove();
            });

            db.ref('pinned_message').on('value', (snapshot) => {
                const pinnedBar = document.getElementById('pinnedBar');
                const pinnedText = document.getElementById('pinnedText');
                const unpinBtn = document.getElementById('unpinBtn');
                
                const val = snapshot.val();
                if (val) {
                    pinnedText.innerText = "📌 " + val;
                    pinnedBar.style.display = 'flex';
                    if (isAdmin) unpinBtn.style.display = 'block';
                } else {
                    pinnedBar.style.display = 'none';
                }
            });

            db.ref('heart_explosions').on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.sender && !isInitialLoad) {
                    launchHeartsExplosion();
                    triggerVibration();
                }
            });

            db.ref('vibration_signals').on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.target === currentUser && !isInitialLoad) {
                    triggerVibration();
                }
            });
        }

        function setupVoiceRecording() {
            const voiceBtn = document.getElementById('voiceBtn');

            voiceBtn.onclick = async () => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert("⚠️ المتصفح لا يدعم الوصول للميكروفون أو تم رفض الإذن.");
                    return;
                }

                if (!isRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };

                        mediaRecorder.onstop = async () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.readAsDataURL(audioBlob);
                            reader.onloadend = () => {
                                sendVoiceMessage(reader.result);
                            };
                            stream.getTracks().forEach(track => track.stop());
                        };

                        mediaRecorder.start();
                        isRecording = true;
                        db.ref(`typing/${myKey}`).set('voice');
                        voiceBtn.classList.add('recording');
                        voiceBtn.innerText = "⏹️";
                    } catch (err) {
                        alert("⚠️ لم يمنح المتصفح إذن المايكروفون.");
                    }
                } else {
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                    isRecording = false;
                    db.ref(`typing/${myKey}`).set('idle');
                    voiceBtn.classList.remove('recording');
                    voiceBtn.innerText = "🎤";
                }
            };
        }

        function sendVoiceMessage(base64Audio) {
            db.ref(`typing/${myKey}`).set('idle');

            db.ref(`status/${partnerKey}`).once('value', (snapshot) => {
                const isPartnerOnline = snapshot.val() && snapshot.val().online;
                const initialStatus = isPartnerOnline ? 'delivered' : 'sent';

                db.ref('messages').push({
                    author: currentUser,
                    text: "🎙️ رسالة صوتية",
                    type: "voice",
                    audioData: base64Audio,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    status: initialStatus
                });
            });
        }

        window.playVoiceNote = function(base64Audio) {
            const audio = new Audio(base64Audio);
            audio.play();
        };

        window.deleteMessage = function(msgKey) {
            if (confirm("هل تريد حذف هذه الرسالة؟")) db.ref(`messages/${msgKey}`).remove();
        };

        window.pinMessage = function(text) { db.ref('pinned_message').set(text); };
        window.unpinMessage = function() { db.ref('pinned_message').remove(); };

        function setupAdminPanel() {
            const adminHeaderBtn = document.getElementById('adminHeaderBtn');
            const adminModal = document.getElementById('adminModal');
            const closeAdminBtn = document.getElementById('closeAdminBtn');

            if (isAdmin) {
                adminHeaderBtn.style.display = 'inline-block';
            } else {
                adminHeaderBtn.style.display = 'none';
            }

            adminHeaderBtn.onclick = () => { adminModal.style.display = 'flex'; };
            closeAdminBtn.onclick = () => { adminModal.style.display = 'none'; };
        }

        window.sendVibrationSignal = function() {
            db.ref('vibration_signals').push({
                sender: currentUser,
                target: partnerUser,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            alert("تم إرسال هزّة تنبيه فورية لشهد!");
        };

        window.triggerFireworks = function() {
            db.ref('heart_explosions').push({
                sender: currentUser,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            alert("تم إطلاق تأثير القلوب لدى الطرفين!");
        };

        window.toggleRemoteLamp = function() {
            db.ref('lamp_status/main').once('value', (snap) => {
                db.ref('lamp_status/main').set(!snap.val());
            });
        };

        window.editDaysCounter = function() {
            const newDays = prompt("أدخل عدد الأيام الجديد للعداد:");
            if (newDays !== null && !isNaN(newDays)) {
                db.ref('love_days').set(parseInt(newDays));
                alert("تم تحديث العداد بنجاح!");
            }
        };

        window.clearAllChat = function() {
            if (confirm("⚠️ هل أنت تأكد من مسح جميع الرسائل فوراً؟")) db.ref('messages').remove();
        };

        window.clearMissHistory = function() {
            if (confirm("⚠️ هل تريد مسح سجل النبضات بالكامل؟")) db.ref('miss_heart_history').remove();
        };

        function sendMessage(text) {
            if (!text.trim()) return;
            db.ref(`typing/${myKey}`).set('idle');

            db.ref(`status/${partnerKey}`).once('value', (snapshot) => {
                const isPartnerOnline = snapshot.val() && snapshot.val().online;
                const initialStatus = isPartnerOnline ? 'delivered' : 'sent';

                db.ref('messages').push({
                    author: currentUser,
                    text: text.trim(),
                    type: "text",
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    status: initialStatus
                });
            });
        }

        function triggerSharedHeartExplosion() {
            sendMessage('❤️');
            db.ref('heart_explosions').push({
                sender: currentUser,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        document.getElementById('sendMsgBtn').onclick = () => {
            const input = document.getElementById('chatInput');
            sendMessage(input.value);
            input.value = '';
        };

        document.getElementById('sendHeartBtn').onclick = () => { triggerSharedHeartExplosion(); };
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('sendMsgBtn').click();
        });

        const accounts = {
            "شهد": { pass: "2000", partner: "أحمد", myKey: "shahad", partnerKey: "ahmed", isAdmin: false },
            "shahad": { pass: "2000", partner: "ahmed", myKey: "shahad", partnerKey: "ahmed", isAdmin: false },
            "أحمد": { pass: "2001", partner: "شهد", myKey: "ahmed", partnerKey: "shahad", isAdmin: true },
            "ahmed": { pass: "2001", partner: "shahad", myKey: "ahmed", partnerKey: "shahad", isAdmin: true }
        };

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const lowerUser = user.toLowerCase();

            if (accounts[lowerUser] && accounts[lowerUser].pass === pass) {
                currentUser = user;
                partnerUser = accounts[lowerUser].partner;
                myKey = accounts[lowerUser].myKey;
                partnerKey = accounts[lowerUser].partnerKey;
                isAdmin = accounts[lowerUser].isAdmin;

                loginContainer.style.display = 'none';
                mainPage.style.display = 'flex';
                document.getElementById('typingTitle').innerText = `أهلاً بك يا ${user} ❤️`;

                setTimeout(() => {
                    db.ref('lamp_status/main').set(true);
                    launchHeartsExplosion();
                    setupPresenceAndTypingSystem();
                    setupBatterySync();
                    setupSharedFingerprint();
                    setupLiveClockAndCounter();
                    setupMissYouSystem();
                    setupHistoryModal();
                    setupLiveChat();
                    setupVoiceRecording();
                    setupAdminPanel();
                }, 300);

            } else {
                alert("❌ اسم المستخدم أو كلمة السر غير صحيحة!");
            }
        });

        function handleLogout() {
            if (myKey) {
                db.ref(`status/${myKey}`).set({
                    online: false,
                    last_seen: firebase.database.ServerValue.TIMESTAMP
                });
                db.ref(`typing/${myKey}`).set('idle');
                db.ref(`shared_touch/${myKey}`).set(false);
            }
            mainPage.style.display = 'none';
            loginContainer.style.display = 'flex';
        }
    </script>
</body>
</html>
